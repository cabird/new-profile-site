<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Christian Bird — Scholarly IDE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Initialize namespace -->
  <script>window.IDE = {};</script>

  <!-- Utils (no component dependencies) -->
  <script type="text/babel" src="utils/helpers.js"></script>
  <script type="text/babel" src="utils/eventLog.js"></script>

  <!-- Icons (no component dependencies) -->
  <script type="text/babel" src="components/Icons.jsx"></script>

  <!-- Leaf components -->
  <script type="text/babel" src="components/StatusBar.jsx"></script>
  <script type="text/babel" src="components/PeekWidget.jsx"></script>
  <script type="text/babel" src="components/PubRow.jsx"></script>
  <script type="text/babel" src="components/CommandPalette.jsx"></script>
  <script type="text/babel" src="components/TerminalPanel.jsx"></script>

  <!-- View components -->
  <script type="text/babel" src="components/HomeView.jsx"></script>
  <script type="text/babel" src="components/PublicationsView.jsx"></script>
  <script type="text/babel" src="components/TagView.jsx"></script>

  <!-- Layout components -->
  <script type="text/babel" src="components/Sidebar.jsx"></script>
  <script type="text/babel" src="components/TitleBar.jsx"></script>
  <script type="text/babel" src="components/ActivityBar.jsx"></script>

  <!-- Main App -->
  <script type="text/babel" src="components/App.jsx"></script>

  <!-- Render -->
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<IDE.App />);
  </script>
</body>
</html>
