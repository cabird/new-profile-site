<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Christian Bird — Scholarly IDE</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <style>
    @font-face { font-family: 'Monaspace Argon'; font-style: normal; font-display: swap; font-weight: 400; src: url(https://cdn.jsdelivr.net/fontsource/fonts/monaspace-argon@latest/latin-400-normal.woff2) format('woff2'); }
    @font-face { font-family: 'Monaspace Argon'; font-style: normal; font-display: swap; font-weight: 500; src: url(https://cdn.jsdelivr.net/fontsource/fonts/monaspace-argon@latest/latin-500-normal.woff2) format('woff2'); }
    @font-face { font-family: 'Monaspace Argon'; font-style: normal; font-display: swap; font-weight: 700; src: url(https://cdn.jsdelivr.net/fontsource/fonts/monaspace-argon@latest/latin-700-normal.woff2) format('woff2'); }
  </style>
  <link rel="stylesheet" href="styles.css?v=4.1.0" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- VS Code Codicons (icon font) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vscode/codicons@0.0.36/dist/codicon.css" />

  <!-- Lucide Icons (fallback) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

  <!-- Initialize namespace and cache-bust version -->
  <script>
    window.IDE = {};
    window.__v = '4.1.0';
  </script>

  <!-- Utils (no component dependencies) -->
  <script type="text/babel" src="utils/helpers.js?v=4.1.0"></script>
  <script type="text/babel" src="utils/eventLog.js?v=4.1.0"></script>

  <!-- Icons (no component dependencies) -->
  <script type="text/babel" src="components/Icons.jsx?v=4.1.0"></script>

  <!-- Leaf components -->
  <script type="text/babel" src="components/StatusBar.jsx?v=4.1.0"></script>
  <script type="text/babel" src="components/PubRow.jsx?v=4.1.0"></script>
  <script type="text/babel" src="components/CommandPalette.jsx?v=4.1.0"></script>
  <script type="text/babel" src="components/TerminalPanel.jsx?v=4.1.0"></script>
  <script type="text/babel" src="components/ChatPanel.jsx?v=4.1.0"></script>

  <!-- View components -->
  <script type="text/babel" src="components/HomeView.jsx?v=4.1.0"></script>
  <script type="text/babel" src="components/PublicationsView.jsx?v=4.1.0"></script>
  <script type="text/babel" src="components/TagView.jsx?v=4.1.0"></script>
  <script type="text/babel" src="components/PaperView.jsx?v=4.1.0"></script>

  <!-- Layout components -->
  <script type="text/babel" src="components/Sidebar.jsx?v=4.1.0"></script>
  <script type="text/babel" src="components/TitleBar.jsx?v=4.1.0"></script>
  <script type="text/babel" src="components/ActivityBar.jsx?v=4.1.0"></script>

  <!-- Main App -->
  <script type="text/babel" src="components/App.jsx?v=4.1.0"></script>

  <!-- Render -->
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<IDE.App />);
  </script>
</body>
</html>
