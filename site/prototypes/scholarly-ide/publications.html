<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publications — Scholarly IDE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ─── Helpers ─── */
    function parseTags(raw) {
      if (!raw) return [];
      if (Array.isArray(raw)) return raw;
      try { return JSON.parse(raw); } catch { return []; }
    }

    function parseTldr(paper) {
      if (!paper.extracted_paper_info) return null;
      try {
        const info = typeof paper.extracted_paper_info === 'string'
          ? JSON.parse(paper.extracted_paper_info)
          : paper.extracted_paper_info;
        return info.tldr || null;
      } catch { return null; }
    }

    /* ─── Inline SVG Icons (no emoji) ─── */
    const FileIconSvg = ({ color = '#569cd6' }) => (
      <svg viewBox="0 0 16 16" fill={color} width="16" height="16">
        <path d="M13.71 4.29l-3-3A1 1 0 0010 1H4a1 1 0 00-1 1v12a1 1 0 001 1h8a1 1 0 001-1V5a1 1 0 00-.29-.71zM12 14H4V2h5v3a1 1 0 001 1h3v8z"/>
      </svg>
    );
    const FileMdIcon = () => <FileIconSvg color="#3794ff" />;
    const FilePdfIcon = () => <FileIconSvg color="#e06c75" />;
    const FolderIcon = ({ open }) => (
      <svg viewBox="0 0 16 16" fill="#dcb67a" width="16" height="16">
        {open
          ? <path d="M1.5 13h12L15 6H5.5l-1-2H1v9zM1 3h3l1 2h10v9H1V3z"/>
          : <path d="M1 3h3l1 2h9v8H1V3zm1 1v8h11V6H4.5l-1-2H2z"/>
        }
      </svg>
    );
    const LinkIcon = () => (
      <svg viewBox="0 0 16 16" fill="#3794ff" width="16" height="16">
        <path d="M7.775 3.275a.75.75 0 001.06 1.06l1.25-1.25a2 2 0 112.83 2.83l-2.5 2.5a2 2 0 01-2.83 0 .75.75 0 00-1.06 1.06 3.5 3.5 0 004.95 0l2.5-2.5a3.5 3.5 0 00-4.95-4.95l-1.25 1.25z"/>
        <path d="M8.225 12.725a.75.75 0 01-1.06-1.06l-1.25 1.25a2 2 0 11-2.83-2.83l2.5-2.5a2 2 0 012.83 0 .75.75 0 001.06-1.06 3.5 3.5 0 00-4.95 0l-2.5 2.5a3.5 3.5 0 004.95 4.95l1.25-1.25z"/>
      </svg>
    );
    const MailIcon = () => (
      <svg viewBox="0 0 16 16" fill="#4ec9b0" width="16" height="16">
        <path d="M1 4v8h14V4H1zm1.2 1h11.6L8 8.5 2.2 5zM2 11V5.9l6 3.6 6-3.6V11H2z"/>
      </svg>
    );
    const ChartIcon = () => (
      <svg viewBox="0 0 16 16" fill="#4ec9b0" width="16" height="16">
        <path d="M2 14V2h1v11h11v1H2zM5 10h1v3H5v-3zm3-3h1v6H8V7zm3-2h1v8h-1V5zm3-3h1v11h-1V2z"/>
      </svg>
    );
    const SearchIconSmall = () => (
      <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14">
        <path d="M11.742 10.344a6.5 6.5 0 10-1.397 1.398h-.001l3.85 3.85a1 1 0 001.415-1.414l-3.867-3.834zM6.5 11a4.5 4.5 0 110-9 4.5 4.5 0 010 9z"/>
      </svg>
    );
    const SendIcon = () => (
      <svg viewBox="0 0 16 16" fill="currentColor" width="16" height="16">
        <path d="M1 1.91L7.2 8 1 14.09 1.91 15 15 8 1.91 1 1 1.91z"/>
      </svg>
    );

    /* ─── Activity bar SVG icons ─── */
    const ExplorerIcon = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/>
      </svg>
    );
    const SearchIcon = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    );
    const PubsIcon = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
    );
    const ChatIcon = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    );

    /* Tab file icon */
    const TabFileIcon = ({ color = '#569cd6' }) => (
      <svg viewBox="0 0 16 16" fill={color} width="14" height="14">
        <path d="M13.71 4.29l-3-3A1 1 0 0010 1H4a1 1 0 00-1 1v12a1 1 0 001 1h8a1 1 0 001-1V5a1 1 0 00-.29-.71zM12 14H4V2h5v3a1 1 0 001 1h3v8z"/>
      </svg>
    );

    /* ─── Title Bar ─── */
    function TitleBar({ name }) {
      return (
        <div className="titlebar">
          <div className="titlebar-dots">
            <span className="titlebar-dot red"></span>
            <span className="titlebar-dot yellow"></span>
            <span className="titlebar-dot green"></span>
          </div>
          <div className="titlebar-text">{name || 'Scholarly IDE'} — publications.md</div>
        </div>
      );
    }

    /* ─── Activity Bar ─── */
    function ActivityBar({ active, onSelect }) {
      const items = [
        { id: 'explorer', icon: <ExplorerIcon />, label: 'Explorer' },
        { id: 'search', icon: <SearchIcon />, label: 'Search' },
        { id: 'publications', icon: <PubsIcon />, label: 'Publications' },
        { id: 'chat', icon: <ChatIcon />, label: 'Chat' },
      ];
      return (
        <div className="activitybar">
          {items.map(item => (
            <button
              key={item.id}
              className={`activity-icon ${active === item.id ? 'active' : ''}`}
              onClick={() => onSelect(item.id)}
              title={item.label}
            >
              {item.icon}
            </button>
          ))}
        </div>
      );
    }

    /* ─── Sidebar ─── */
    function SidebarComponent({ siteData, activePage }) {
      const [openSections, setOpenSections] = useState({ editors: true, project: true });
      const [openSubSections, setOpenSubSections] = useState({});

      const toggleSection = (key) => {
        setOpenSections(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const toggleSub = (key) => {
        setOpenSubSections(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const contact = siteData?.contact;

      return (
        <nav className="sidebar">
          <div className="sidebar-title">Explorer</div>
          <div className="sidebar-content">
            <div className="tree-section">
              <div className="tree-section-header" onClick={() => toggleSection('editors')}>
                <span className={`tree-chevron ${openSections.editors ? 'open' : ''}`}>{'\u25B8'}</span>
                Open Editors
              </div>
              <div className={`tree-section-body ${openSections.editors ? 'open' : ''}`}>
                <a href="publications.html" className={`tree-item ${activePage === 'publications' ? 'active' : ''}`}>
                  <span className="tree-item-icon file-md"><FileMdIcon /></span>
                  <span className="tree-item-label">publications.md</span>
                </a>
              </div>
            </div>

            <div className="tree-section">
              <div className="tree-section-header" onClick={() => toggleSection('project')}>
                <span className={`tree-chevron ${openSections.project ? 'open' : ''}`}>{'\u25B8'}</span>
                CBIRD-SITE
              </div>
              <div className={`tree-section-body ${openSections.project ? 'open' : ''}`}>
                <a href="index.html" className={`tree-item ${activePage === 'home' ? 'active' : ''}`}>
                  <span className="tree-item-icon file-md"><FileMdIcon /></span>
                  <span className="tree-item-label">home.md</span>
                </a>
                <a href="publications.html" className={`tree-item ${activePage === 'publications' ? 'active' : ''}`}>
                  <span className="tree-item-icon file-md"><FileMdIcon /></span>
                  <span className="tree-item-label">publications.md</span>
                </a>
                {siteData?.cv_link && (
                  <a href={siteData.cv_link} target="_blank" rel="noopener" className="tree-item">
                    <span className="tree-item-icon file-pdf"><FilePdfIcon /></span>
                    <span className="tree-item-label">cv.pdf</span>
                  </a>
                )}
                <div className="tree-item" onClick={() => toggleSub('contact')} style={{cursor:'pointer'}}>
                  <span className="tree-item-icon folder"><FolderIcon open={openSubSections.contact} /></span>
                  <span className="tree-item-label">contact/</span>
                </div>
                {openSubSections.contact && contact && (
                  <>
                    {contact.email && (
                      <a href={`mailto:${contact.email}`} className="tree-item tree-sub-item">
                        <span className="tree-item-icon file-mail"><MailIcon /></span>
                        <span className="tree-item-label">{contact.email}</span>
                      </a>
                    )}
                    {contact.links?.map((l, i) => (
                      <a key={i} href={l.url} target="_blank" rel="noopener" className="tree-item tree-sub-item">
                        <span className="tree-item-icon file-link"><LinkIcon /></span>
                        <span className="tree-item-label">{l.label}</span>
                      </a>
                    ))}
                  </>
                )}
                {siteData?.research_areas?.length > 0 && (
                  <>
                    <div className="tree-item" onClick={() => toggleSub('research')} style={{cursor:'pointer'}}>
                      <span className="tree-item-icon folder"><FolderIcon open={openSubSections.research} /></span>
                      <span className="tree-item-label">research_areas/</span>
                    </div>
                    {openSubSections.research && siteData.research_areas.map((area, i) => (
                      <div key={i} className="tree-item tree-sub-item" style={{cursor:'default'}}>
                        <span className="tree-item-icon file-chart"><ChartIcon /></span>
                        <span className="tree-item-label">{area.title}</span>
                      </div>
                    ))}
                  </>
                )}
              </div>
            </div>
          </div>
        </nav>
      );
    }

    /* ─── Copilot Chat Side Panel ─── */
    function CopilotPanel({ paper, onClose }) {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [streaming, setStreaming] = useState(false);
      const [cannedQuestions, setCannedQuestions] = useState([]);
      const [status, setStatus] = useState('');
      const messagesEndRef = useRef(null);
      const abortRef = useRef(null);

      useEffect(() => {
        fetch('/api/canned_questions')
          .then(r => r.json())
          .then(d => setCannedQuestions(d.questions || []))
          .catch(() => {});
      }, []);

      useEffect(() => {
        setMessages([]);
        setStatus('');
        setInput('');
        return () => {
          if (abortRef.current) abortRef.current.abort();
        };
      }, [paper?.id]);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, streaming]);

      const sendMessage = useCallback(async (text) => {
        if (!text.trim() || streaming || !paper) return;
        const userMsg = { role: 'user', content: text.trim() };
        setMessages(prev => [...prev, userMsg]);
        setInput('');
        setStreaming(true);
        setStatus('');

        let assistantContent = '';
        setMessages(prev => [...prev, { role: 'assistant', content: '' }]);

        try {
          abortRef.current = new AbortController();
          const resp = await fetch(`/api/papers/${paper.id}/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: userMsg.content }),
            signal: abortRef.current.signal,
          });

          if (!resp.ok) {
            const errData = await resp.json().catch(() => ({}));
            throw new Error(errData.error || `HTTP ${resp.status}`);
          }

          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed.startsWith('data:')) continue;
              const jsonStr = trimmed.slice(5).trim();
              if (!jsonStr || jsonStr === '[DONE]') continue;

              try {
                const evt = JSON.parse(jsonStr);
                if (evt.type === 'chat_chunk') {
                  assistantContent += evt.content;
                  setMessages(prev => {
                    const next = [...prev];
                    next[next.length - 1] = { role: 'assistant', content: assistantContent };
                    return next;
                  });
                } else if (evt.type === 'chat_complete') {
                  const remaining = evt.remaining_messages;
                  const count = evt.message_count;
                  setStatus(`${count} messages \u00B7 ${remaining} remaining`);
                } else if (evt.type === 'error') {
                  setMessages(prev => [...prev, { role: 'error', content: evt.message }]);
                }
              } catch {}
            }
          }
        } catch (err) {
          if (err.name !== 'AbortError') {
            setMessages(prev => [...prev, { role: 'error', content: err.message }]);
          }
        }
        setStreaming(false);
      }, [streaming, paper]);

      const clearChat = useCallback(async () => {
        if (!paper) return;
        try {
          await fetch(`/api/papers/${paper.id}/chat`, { method: 'DELETE' });
        } catch {}
        setMessages([]);
        setStatus('');
      }, [paper]);

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage(input);
        }
      };

      if (!paper) return null;

      return (
        <div className="copilot-panel">
          {/* Header */}
          <div className="copilot-header">
            <div className="copilot-header-icon">{'\u2726'}</div>
            <div className="copilot-header-text">
              <div className="copilot-header-title">Paper Assistant</div>
              <div className="copilot-header-subtitle">{paper.title}</div>
            </div>
            <div className="copilot-header-actions">
              <button className="copilot-header-btn" onClick={clearChat} title="Clear conversation">
                <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14">
                  <path d="M8 1a7 7 0 100 14A7 7 0 008 1zm3.11 9.11a.5.5 0 01-.71.71L8 8.71l-2.4 2.11a.5.5 0 01-.71-.71L7.29 8 4.89 5.6a.5.5 0 01.71-.71L8 7.29l2.4-2.4a.5.5 0 01.71.71L8.71 8l2.4 2.11z"/>
                </svg>
              </button>
              <button className="copilot-header-btn" onClick={onClose} title="Close panel">
                <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14">
                  <path d="M8 8.71l3.65 3.64a.5.5 0 00.7-.7L8.71 8l3.64-3.65a.5.5 0 00-.7-.7L8 7.29 4.35 3.65a.5.5 0 00-.7.7L7.29 8l-3.64 3.65a.5.5 0 00.7.7L8 8.71z"/>
                </svg>
              </button>
            </div>
          </div>

          {/* Panel tabs */}
          <div className="copilot-tabs">
            <button className="copilot-tab active">Chat</button>
            <button className="copilot-tab" style={{opacity: 0.4, cursor: 'default'}}>History</button>
          </div>

          {/* Messages */}
          <div className="copilot-messages">
            {messages.length === 0 && (
              <div className="copilot-welcome">
                <div className="copilot-welcome-icon">{'\u2726'}</div>
                <div className="copilot-welcome-title">Ask about this paper</div>
                <div className="copilot-welcome-sub">I can help you understand the key findings, methods, and implications.</div>
              </div>
            )}
            {messages.map((m, i) => (
              <div key={i} className={`copilot-msg ${m.role}`}>
                <div className="copilot-msg-avatar">
                  {m.role === 'user' ? 'U' : m.role === 'error' ? '!' : '\u2726'}
                </div>
                <div className="copilot-msg-content">
                  <div className="copilot-msg-text">{m.content}</div>
                </div>
              </div>
            ))}
            {streaming && messages[messages.length - 1]?.content === '' && (
              <div className="copilot-thinking">
                <div className="copilot-thinking-avatar">{'\u2726'}</div>
                <div className="copilot-thinking-dots">
                  <span></span><span></span><span></span>
                </div>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>

          {/* Canned question chips */}
          {cannedQuestions.length > 0 && messages.length === 0 && (
            <div className="copilot-suggestions">
              {cannedQuestions.map((q, i) => (
                <button
                  key={i}
                  className="copilot-chip"
                  onClick={() => sendMessage(q)}
                  disabled={streaming}
                >
                  {q}
                </button>
              ))}
            </div>
          )}

          {status && <div className="copilot-status">{status}</div>}

          {/* Input area */}
          <div className="copilot-input-area">
            <div className="copilot-input-wrap">
              <input
                type="text"
                placeholder="Ask about this paper..."
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={handleKeyDown}
                disabled={streaming}
              />
              <button
                className="copilot-send-btn"
                onClick={() => sendMessage(input)}
                disabled={streaming || !input.trim()}
              >
                <SendIcon />
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ─── Publication Row ─── */
    function PubRow({ paper, lineNum, isExpanded, onToggle, onChat }) {
      const tags = parseTags(paper.tags);
      const tldr = parseTldr(paper);

      return (
        <div className="pub-row">
          <div className="pub-row-main" onClick={onToggle}>
            <span className="pub-ln">{lineNum}</span>
            <span className="pub-year">{paper.year || '\u2014'}</span>
            <div className="pub-title-col">
              <div className="pub-title">{paper.title}</div>
              <div className="pub-authors">{paper.authors || ''}</div>
            </div>
            <span className="pub-venue">{paper.venue || paper.journal || ''}</span>
            <div className="pub-tags">
              {tags.slice(0, 3).map((t, i) => (
                <span className="pub-tag" key={i}>{t}</span>
              ))}
            </div>
          </div>
          <div className={`pub-expanded ${isExpanded ? 'open' : ''}`}>
            {tldr && (
              <div className="pub-abstract">
                <div className="label">// tl;dr</div>
                {tldr}
              </div>
            )}
            <div className="pub-actions">
              {paper.mapped_pdf && (
                <a className="pub-action-btn" href={paper.mapped_pdf} target="_blank" rel="noopener">
                  <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12"><path d="M13.71 4.29l-3-3A1 1 0 0010 1H4a1 1 0 00-1 1v12a1 1 0 001 1h8a1 1 0 001-1V5a1 1 0 00-.29-.71zM12 14H4V2h5v3a1 1 0 001 1h3v8z"/></svg>
                  PDF
                </a>
              )}
              {paper.doi && (
                <a className="pub-action-btn" href={`https://doi.org/${paper.doi}`} target="_blank" rel="noopener">
                  DOI
                </a>
              )}
              {paper.url && (
                <a className="pub-action-btn" href={paper.url} target="_blank" rel="noopener">
                  Link
                </a>
              )}
              {paper.chat_available && (
                <button className="pub-action-btn chat-btn" onClick={(e) => { e.stopPropagation(); onChat(paper); }}>
                  <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12"><path d="M14 1H2a1 1 0 00-1 1v9a1 1 0 001 1h3l3 3 3-3h3a1 1 0 001-1V2a1 1 0 00-1-1zm0 10h-3.6L8 13.4 5.6 11H2V2h12v9z"/></svg>
                  Chat with Paper
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ─── Status Bar ─── */
    function StatusBar({ paperCount, filteredCount }) {
      return (
        <div className="statusbar">
          <div className="statusbar-left">
            <span className="statusbar-item">main</span>
            <span className="statusbar-item">0 errors 0 warnings</span>
          </div>
          <div className="statusbar-right">
            <span className="statusbar-item">Ln 1, Col 1</span>
            <span className="statusbar-item">UTF-8</span>
            <span className="statusbar-item">Markdown</span>
            <span className="statusbar-item">{filteredCount}/{paperCount} pubs</span>
            <span className="statusbar-item">v2.0.0</span>
          </div>
        </div>
      );
    }

    /* ─── Main App ─── */
    function App() {
      const [siteData, setSiteData] = useState(null);
      const [allPapers, setAllPapers] = useState([]);
      const [search, setSearch] = useState('');
      const [activeTag, setActiveTag] = useState(null);
      const [expandedId, setExpandedId] = useState(null);
      const [chatPaper, setChatPaper] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeActivity, setActiveActivity] = useState('publications');
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [mobileSidebar, setMobileSidebar] = useState(false);

      useEffect(() => {
        Promise.all([
          fetch('/site_data.json').then(r => r.json()),
          fetch('/api/paper_data.json').then(r => r.json()),
        ]).then(([site, paperData]) => {
          setSiteData(site);
          const list = Object.entries(paperData.papers || {}).map(([id, p]) => ({ id, ...p }));
          list.sort((a, b) => (b.year || 0) - (a.year || 0));
          setAllPapers(list);
          setLoading(false);
        }).catch(() => setLoading(false));
      }, []);

      const handleActivitySelect = (id) => {
        if (id === 'explorer' || id === 'search') {
          if (id === activeActivity) {
            setSidebarOpen(!sidebarOpen);
          } else {
            setActiveActivity(id);
            setSidebarOpen(true);
          }
          return;
        }
        if (id === 'chat') {
          if (chatPaper) {
            setChatPaper(null);
          }
          if (id === activeActivity) {
            setSidebarOpen(!sidebarOpen);
          } else {
            setActiveActivity(id);
            setSidebarOpen(true);
          }
          return;
        }
        if (id === activeActivity) {
          setSidebarOpen(!sidebarOpen);
        } else {
          setActiveActivity(id);
          setSidebarOpen(true);
        }
      };

      /* Collect all unique tags */
      const allTags = React.useMemo(() => {
        const tagSet = new Set();
        allPapers.forEach(p => parseTags(p.tags).forEach(t => tagSet.add(t)));
        return [...tagSet].sort();
      }, [allPapers]);

      /* Filter papers */
      const filtered = React.useMemo(() => {
        let list = allPapers;
        if (activeTag) {
          list = list.filter(p => parseTags(p.tags).includes(activeTag));
        }
        if (search.trim()) {
          const q = search.toLowerCase();
          list = list.filter(p =>
            (p.title || '').toLowerCase().includes(q) ||
            (p.authors || '').toLowerCase().includes(q) ||
            (p.venue || '').toLowerCase().includes(q) ||
            (p.journal || '').toLowerCase().includes(q) ||
            parseTags(p.tags).some(t => t.toLowerCase().includes(q))
          );
        }
        return list;
      }, [allPapers, search, activeTag]);

      const shellClasses = [
        'vscode-shell',
        !sidebarOpen ? 'sidebar-collapsed' : '',
        mobileSidebar ? 'mobile-sidebar-open' : '',
        chatPaper ? 'copilot-open' : '',
      ].filter(Boolean).join(' ');

      return (
        <div className={shellClasses}>
          <button className="hamburger" onClick={() => setMobileSidebar(!mobileSidebar)}>{'\u2630'}</button>
          {mobileSidebar && <div className="mobile-overlay open" onClick={() => setMobileSidebar(false)}></div>}

          <TitleBar name={siteData?.name} />
          <ActivityBar active={activeActivity} onSelect={handleActivitySelect} />
          <SidebarComponent siteData={siteData} activePage="publications" />

          <div className="editor-area">
            {/* Tab Bar */}
            <div className="tabbar">
              <a href="index.html" className="tab">
                <span className="tab-icon"><TabFileIcon color="#3794ff" /></span>
                home.md
                <span className="tab-close">{'\u00D7'}</span>
              </a>
              <a href="publications.html" className="tab active">
                <span className="tab-icon"><TabFileIcon color="#3794ff" /></span>
                publications.md
                <span className="tab-close">{'\u00D7'}</span>
              </a>
            </div>

            {/* Breadcrumb */}
            <div className="breadcrumb">
              <a href="#">cbird-site</a>
              <span className="breadcrumb-sep">{'\u203A'}</span>
              <span>publications.md</span>
            </div>

            {/* Editor content */}
            <div className="editor-content">
              <div className="editor-body" style={{ flex: 1 }}>
                {loading ? (
                  <div className="loading">Loading publications...</div>
                ) : (
                  <>
                    {/* Search Bar */}
                    <div className="search-bar-container">
                      <div className="search-bar">
                        <span className="search-icon-prefix"><SearchIconSmall /></span>
                        <input
                          type="text"
                          placeholder="Search titles, authors, venues, tags..."
                          value={search}
                          onChange={e => setSearch(e.target.value)}
                        />
                        <span className="result-count">{filtered.length}/{allPapers.length}</span>
                      </div>
                    </div>

                    {/* Tag Filters */}
                    {allTags.length > 0 && (
                      <div className="tag-filters">
                        <button
                          className={`tag-btn ${!activeTag ? 'active' : ''}`}
                          onClick={() => setActiveTag(null)}
                        >
                          all
                        </button>
                        {allTags.map(t => (
                          <button
                            key={t}
                            className={`tag-btn ${activeTag === t ? 'active' : ''}`}
                            onClick={() => setActiveTag(activeTag === t ? null : t)}
                          >
                            {t}
                          </button>
                        ))}
                      </div>
                    )}

                    {/* Table Header */}
                    <div className="pub-list-header">
                      <span className="col-ln">#</span>
                      <span className="col-year">Year</span>
                      <span className="col-title">Title / Authors</span>
                      <span className="col-venue">Venue</span>
                      <span className="col-tags">Tags</span>
                    </div>

                    {/* Publication Rows */}
                    {filtered.map((p, idx) => (
                      <PubRow
                        key={p.id}
                        paper={p}
                        lineNum={idx + 1}
                        isExpanded={expandedId === p.id}
                        onToggle={() => setExpandedId(expandedId === p.id ? null : p.id)}
                        onChat={(paper) => setChatPaper(paper)}
                      />
                    ))}

                    {filtered.length === 0 && (
                      <div className="loading" style={{textAlign:'center', padding: '24px 0'}}>
                        No results matching "{search}"{activeTag ? ` in tag [${activeTag}]` : ''}
                      </div>
                    )}

                    <footer className="page-footer">
                      {allPapers.length} publications indexed
                    </footer>
                  </>
                )}
              </div>
            </div>
          </div>

          {/* Copilot Chat Side Panel */}
          {chatPaper && (
            <CopilotPanel
              paper={chatPaper}
              onClose={() => setChatPaper(null)}
            />
          )}

          <StatusBar paperCount={allPapers.length} filteredCount={filtered.length} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
