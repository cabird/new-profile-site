<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publications — Scholarly IDE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    /* ─── Helpers ─── */
    function slugify(text) {
      return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    function parseTags(raw) {
      if (!raw) return [];
      if (Array.isArray(raw)) return raw;
      try { return JSON.parse(raw); } catch { return []; }
    }

    function parseTldr(paper) {
      if (!paper.extracted_paper_info) return null;
      try {
        const info = typeof paper.extracted_paper_info === 'string'
          ? JSON.parse(paper.extracted_paper_info)
          : paper.extracted_paper_info;
        return info.tldr || null;
      } catch { return null; }
    }

    /* ─── Inline SVG Icons (no emoji) ─── */
    const FileIconSvg = ({ color = '#569cd6' }) => (
      <svg viewBox="0 0 16 16" fill={color} width="16" height="16">
        <path d="M13.71 4.29l-3-3A1 1 0 0010 1H4a1 1 0 00-1 1v12a1 1 0 001 1h8a1 1 0 001-1V5a1 1 0 00-.29-.71zM12 14H4V2h5v3a1 1 0 001 1h3v8z"/>
      </svg>
    );
    const FileMdIcon = () => <FileIconSvg color="#3794ff" />;
    const FilePdfIcon = () => <FileIconSvg color="#e06c75" />;
    const FileTxtIcon = () => <FileIconSvg color="#858585" />;
    const FolderIcon = ({ open }) => (
      <svg viewBox="0 0 16 16" fill="#dcb67a" width="16" height="16">
        {open
          ? <path d="M1.5 13h12L15 6H5.5l-1-2H1v9zM1 3h3l1 2h10v9H1V3z"/>
          : <path d="M1 3h3l1 2h9v8H1V3zm1 1v8h11V6H4.5l-1-2H2z"/>
        }
      </svg>
    );
    const LinkIcon = () => (
      <svg viewBox="0 0 16 16" fill="#3794ff" width="16" height="16">
        <path d="M7.775 3.275a.75.75 0 001.06 1.06l1.25-1.25a2 2 0 112.83 2.83l-2.5 2.5a2 2 0 01-2.83 0 .75.75 0 00-1.06 1.06 3.5 3.5 0 004.95 0l2.5-2.5a3.5 3.5 0 00-4.95-4.95l-1.25 1.25z"/>
        <path d="M8.225 12.725a.75.75 0 01-1.06-1.06l-1.25 1.25a2 2 0 11-2.83-2.83l2.5-2.5a2 2 0 012.83 0 .75.75 0 001.06-1.06 3.5 3.5 0 00-4.95 0l-2.5 2.5a3.5 3.5 0 004.95 4.95l1.25-1.25z"/>
      </svg>
    );
    const MailIcon = () => (
      <svg viewBox="0 0 16 16" fill="#4ec9b0" width="16" height="16">
        <path d="M1 4v8h14V4H1zm1.2 1h11.6L8 8.5 2.2 5zM2 11V5.9l6 3.6 6-3.6V11H2z"/>
      </svg>
    );
    const ChartIcon = () => (
      <svg viewBox="0 0 16 16" fill="#4ec9b0" width="16" height="16">
        <path d="M2 14V2h1v11h11v1H2zM5 10h1v3H5v-3zm3-3h1v6H8V7zm3-2h1v8h-1V5zm3-3h1v11h-1V2z"/>
      </svg>
    );
    const SearchIconSmall = () => (
      <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14">
        <path d="M11.742 10.344a6.5 6.5 0 10-1.397 1.398h-.001l3.85 3.85a1 1 0 001.415-1.414l-3.867-3.834zM6.5 11a4.5 4.5 0 110-9 4.5 4.5 0 010 9z"/>
      </svg>
    );

    /* ─── Activity bar SVG icons ─── */
    const ExplorerIcon = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/>
      </svg>
    );
    const SearchIcon = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    );
    const PubsIcon = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
    );
    const ChatIcon = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    );
    const TerminalIcon = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
      </svg>
    );

    /* Tab file icon */
    const TabFileIcon = ({ color = '#569cd6' }) => (
      <svg viewBox="0 0 16 16" fill={color} width="14" height="14">
        <path d="M13.71 4.29l-3-3A1 1 0 0010 1H4a1 1 0 00-1 1v12a1 1 0 001 1h8a1 1 0 001-1V5a1 1 0 00-.29-.71zM12 14H4V2h5v3a1 1 0 001 1h3v8z"/>
      </svg>
    );

    /* ─── File icon for command palette based on extension ─── */
    function PaletteFileIcon({ ext }) {
      if (ext === '.md') return <FileMdIcon />;
      if (ext === '.pdf') return <FilePdfIcon />;
      if (ext === '.txt') return <FileTxtIcon />;
      return <FileIconSvg color="#569cd6" />;
    }

    /* ─── Build virtual filesystem ─── */
    function buildVirtualFS(siteData, papers, onSelectPaper) {
      const files = [];

      files.push({ name: 'home.md', path: 'home.md', ext: '.md', action: () => { window.location.href = 'index.html'; } });
      files.push({ name: 'publications.md', path: 'publications.md', ext: '.md', action: () => { window.location.href = 'publications.html'; } });

      if (siteData?.cv_link) {
        files.push({ name: 'cv.pdf', path: 'cv.pdf', ext: '.pdf', action: () => { window.open(siteData.cv_link, '_blank'); } });
      }

      const contact = siteData?.contact;
      if (contact) {
        if (contact.email) {
          files.push({ name: 'email.txt', path: 'contact/email.txt', ext: '.txt', action: () => { window.location.href = `mailto:${contact.email}`; } });
        }
        if (contact.links) {
          contact.links.forEach(l => {
            const slug = slugify(l.label) + '.txt';
            files.push({ name: slug, path: `contact/${slug}`, ext: '.txt', action: () => { window.open(l.url, '_blank'); } });
          });
        }
      }

      if (papers) {
        papers.forEach(p => {
          const year = p.year || 'unknown';
          const slug = slugify(p.title || 'untitled') + '.md';
          files.push({
            name: slug,
            path: `publications/${year}/${slug}`,
            ext: '.md',
            paperId: p.id,
            action: () => {
              // On publications page, scroll to and expand the paper
              onSelectPaper(p.id);
            }
          });
        });
      }

      return files;
    }

    /* ─── Fuzzy match highlight ─── */
    function highlightMatch(text, query) {
      if (!query) return text;
      const lower = text.toLowerCase();
      const qLower = query.toLowerCase();
      const idx = lower.indexOf(qLower);
      if (idx === -1) return text;
      return (
        <span>
          {text.slice(0, idx)}
          <span className="match-char">{text.slice(idx, idx + query.length)}</span>
          {text.slice(idx + query.length)}
        </span>
      );
    }

    /* ─── Command Palette ─── */
    function CommandPalette({ files, onClose }) {
      const [query, setQuery] = useState('');
      const [selectedIdx, setSelectedIdx] = useState(0);
      const inputRef = useRef(null);
      const listRef = useRef(null);

      useEffect(() => {
        inputRef.current?.focus();
      }, []);

      const filtered = useMemo(() => {
        if (!query.trim()) return files;
        const q = query.toLowerCase();
        return files.filter(f => f.path.toLowerCase().includes(q));
      }, [files, query]);

      useEffect(() => {
        setSelectedIdx(0);
      }, [query]);

      useEffect(() => {
        if (listRef.current) {
          const selected = listRef.current.children[selectedIdx];
          if (selected) selected.scrollIntoView({ block: 'nearest' });
        }
      }, [selectedIdx]);

      const handleKeyDown = (e) => {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          setSelectedIdx(prev => Math.min(prev + 1, filtered.length - 1));
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          setSelectedIdx(prev => Math.max(prev - 1, 0));
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (filtered[selectedIdx]) {
            filtered[selectedIdx].action();
            onClose();
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          onClose();
        }
      };

      return (
        <div className="command-palette-backdrop" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="command-palette">
            <div className="command-palette-input">
              <input
                ref={inputRef}
                type="text"
                placeholder="Go to File..."
                value={query}
                onChange={e => setQuery(e.target.value)}
                onKeyDown={handleKeyDown}
              />
            </div>
            <div className="command-palette-results" ref={listRef}>
              {filtered.length === 0 && (
                <div className="command-palette-empty">No matching files</div>
              )}
              {filtered.map((f, i) => (
                <div
                  key={f.path}
                  className={`command-palette-row ${i === selectedIdx ? 'selected' : ''}`}
                  onClick={() => { f.action(); onClose(); }}
                  onMouseEnter={() => setSelectedIdx(i)}
                >
                  <span className="command-palette-row-icon"><PaletteFileIcon ext={f.ext} /></span>
                  <span className="command-palette-row-name">{highlightMatch(f.name, query)}</span>
                  <span className="command-palette-row-path">{highlightMatch(f.path, query)}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    /* ─── Terminal Panel ─── */
    /* ─── ASCII Spinner (npm-style braille dots) ─── */
    function AsciiSpinner() {
      const frames = ['\u280B','\u2819','\u2839','\u2838','\u283C','\u2834','\u2826','\u2827','\u2807','\u280F'];
      const [idx, setIdx] = useState(0);
      useEffect(() => {
        const id = setInterval(() => setIdx(i => (i + 1) % frames.length), 80);
        return () => clearInterval(id);
      }, []);
      return <span className="terminal-text" style={{ color: '#6a9955' }}>{frames[idx]} querying paper...</span>;
    }

    function TerminalPanel({ papers, chatPaper, setChatPaper, onClose }) {
      const [activeTab, setActiveTab] = useState('terminal');
      const [history, setHistory] = useState([]);
      const [input, setInput] = useState('');
      const [streaming, setStreaming] = useState(false);
      const inputRef = useRef(null);
      const bodyRef = useRef(null);
      const abortRef = useRef(null);

      const warningCount = useMemo(() => {
        return papers.filter(p => !p.doi || !p.mapped_pdf).length;
      }, [papers]);

      const problemsList = useMemo(() => {
        const problems = [];
        papers.forEach(p => {
          if (!p.doi) problems.push({ text: `Missing DOI: ${p.title}`, source: p.id });
          if (!p.mapped_pdf) problems.push({ text: `Missing PDF: ${p.title}`, source: p.id });
        });
        return problems;
      }, [papers]);

      useEffect(() => {
        if (bodyRef.current) {
          bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
        }
      }, [history, streaming]);

      useEffect(() => {
        if (activeTab === 'terminal') {
          inputRef.current?.focus();
        }
      }, [activeTab]);

      // Reset history when paper changes
      useEffect(() => {
        setHistory([]);
        setInput('');
        return () => {
          if (abortRef.current) abortRef.current.abort();
        };
      }, [chatPaper?.id]);

      const sendMessage = useCallback(async (text) => {
        if (!text.trim() || streaming) return;
        if (!chatPaper) return;

        setHistory(prev => [...prev, { type: 'user', content: text.trim() }]);
        setInput('');
        setStreaming(true);

        let assistantContent = '';
        setHistory(prev => [...prev, { type: 'assistant', content: '' }]);

        try {
          abortRef.current = new AbortController();
          const resp = await fetch(`/api/papers/${chatPaper.id}/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text.trim() }),
            signal: abortRef.current.signal,
          });

          if (!resp.ok) {
            const errData = await resp.json().catch(() => ({}));
            throw new Error(errData.error || `HTTP ${resp.status}`);
          }

          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed.startsWith('data:')) continue;
              const jsonStr = trimmed.slice(5).trim();
              if (!jsonStr || jsonStr === '[DONE]') continue;

              try {
                const evt = JSON.parse(jsonStr);
                if (evt.type === 'chat_chunk') {
                  assistantContent += evt.content;
                  setHistory(prev => {
                    const next = [...prev];
                    next[next.length - 1] = { type: 'assistant', content: assistantContent };
                    return next;
                  });
                } else if (evt.type === 'chat_complete') {
                  setHistory(prev => [...prev, { type: 'status', content: `${evt.message_count} messages \u00B7 ${evt.remaining_messages} remaining` }]);
                } else if (evt.type === 'error') {
                  setHistory(prev => [...prev, { type: 'error', content: evt.message }]);
                }
              } catch {}
            }
          }
        } catch (err) {
          if (err.name !== 'AbortError') {
            setHistory(prev => [...prev, { type: 'error', content: err.message }]);
          }
        }
        setStreaming(false);
        setTimeout(() => inputRef.current?.focus(), 50);
      }, [streaming, chatPaper]);

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage(input);
        }
      };

      const panelRef = useRef(null);
      const heightRef = useRef(250);

      // Set the CSS variable on the shell element to control grid row height
      useEffect(() => {
        const shell = document.querySelector('.vscode-shell');
        if (shell) {
          shell.style.setProperty('--terminal-current-h', heightRef.current + 'px');
        }
      }, []);

      const handleDragStart = useCallback((e) => {
        e.preventDefault();
        const startY = e.clientY;
        const startHeight = heightRef.current;
        const shell = document.querySelector('.vscode-shell');
        const onMove = (ev) => {
          const delta = startY - ev.clientY;
          const newHeight = Math.max(100, Math.min(startHeight + delta, window.innerHeight - 200));
          heightRef.current = newHeight;
          if (shell) shell.style.setProperty('--terminal-current-h', newHeight + 'px');
        };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        };
        document.body.style.cursor = 'row-resize';
        document.body.style.userSelect = 'none';
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      }, []);

      return (
        <div className="terminal-panel" ref={panelRef}>
          <div className="terminal-resize-handle" onMouseDown={handleDragStart}></div>
          <div className="terminal-panel-header">
            <div className="terminal-panel-tabs">
              <button
                className={`terminal-panel-tab ${activeTab === 'problems' ? 'active' : ''}`}
                onClick={() => setActiveTab('problems')}
              >
                Problems
                {warningCount > 0 && <span className="tab-badge">{warningCount}</span>}
              </button>
              <button
                className={`terminal-panel-tab ${activeTab === 'output' ? 'active' : ''}`}
                onClick={() => setActiveTab('output')}
              >
                Output
              </button>
              <button
                className={`terminal-panel-tab ${activeTab === 'terminal' ? 'active' : ''}`}
                onClick={() => setActiveTab('terminal')}
              >
                Terminal
              </button>
            </div>
            <div className="terminal-panel-actions">
              <button className="terminal-panel-action-btn" onClick={onClose} title="Close panel">
                <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14">
                  <path d="M8 8.71l3.65 3.64a.5.5 0 00.7-.7L8.71 8l3.64-3.65a.5.5 0 00-.7-.7L8 7.29 4.35 3.65a.5.5 0 00-.7.7L7.29 8l-3.64 3.65a.5.5 0 00.7.7L8 8.71z"/>
                </svg>
              </button>
            </div>
          </div>

          <div className="terminal-panel-body" ref={bodyRef}>
            {activeTab === 'problems' && (
              <div className="terminal-problems">
                {problemsList.length === 0 ? (
                  <div className="terminal-output-empty">No problems detected.</div>
                ) : (
                  problemsList.map((prob, i) => (
                    <div className="terminal-problem-row" key={i}>
                      <span className="terminal-problem-icon">{'\u26A0'}</span>
                      <span className="terminal-problem-text">{prob.text}</span>
                      <span className="terminal-problem-source">[{prob.source}]</span>
                    </div>
                  ))
                )}
              </div>
            )}

            {activeTab === 'output' && (
              <div className="terminal-output-empty">No output</div>
            )}

            {activeTab === 'terminal' && (
              <>
                <div className="terminal-welcome">{`Welcome to Scholarly IDE Terminal\nType a question to chat with a paper.\nUse Ctrl+P to find and select a paper first.\n---`}</div>

                {chatPaper && (
                  <div className="terminal-connected">Connected to: {chatPaper.title}</div>
                )}

                {!chatPaper && history.length === 0 && (
                  <div className="terminal-line">
                    <span className="terminal-text" style={{ color: '#858585' }}>No paper selected. Use Ctrl+P to find a paper, then click 'Chat' to start.</span>
                  </div>
                )}

                {history.map((entry, i) => {
                  if (entry.type === 'user') {
                    return (
                      <div className="terminal-line" key={i}>
                        <span className="terminal-prompt">{'\u276F'}</span>
                        <span className="terminal-text">{entry.content}</span>
                      </div>
                    );
                  }
                  if (entry.type === 'assistant') {
                    return (
                      <div className="terminal-line assistant-line" key={i}>
                        <span className="terminal-text">{entry.content}</span>
                      </div>
                    );
                  }
                  if (entry.type === 'error') {
                    return (
                      <div className="terminal-line error-line" key={i}>
                        <span className="terminal-text">Error: {entry.content}</span>
                      </div>
                    );
                  }
                  if (entry.type === 'status') {
                    return (
                      <div className="terminal-line" key={i} style={{ color: '#858585', fontSize: '11px' }}>
                        <span className="terminal-text">{entry.content}</span>
                      </div>
                    );
                  }
                  return null;
                })}

                {streaming && (
                  <div className="terminal-line">
                    <span className="terminal-prompt">{'\u276F'}</span>
                    <AsciiSpinner />
                  </div>
                )}

                {chatPaper && !streaming && (
                  <div className="terminal-input-row">
                    <span className="terminal-prompt">{'\u276F'}</span>
                    <input
                      ref={inputRef}
                      type="text"
                      value={input}
                      onChange={e => setInput(e.target.value)}
                      onKeyDown={handleKeyDown}
                      placeholder="Type a question..."
                      disabled={streaming}
                    />
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    /* ─── Title Bar ─── */
    function TitleBar({ name, onCommandPalette }) {
      return (
        <div className="titlebar">
          <div className="titlebar-dots">
            <span className="titlebar-dot red"></span>
            <span className="titlebar-dot yellow"></span>
            <span className="titlebar-dot green"></span>
          </div>
          <div className="titlebar-text" onClick={onCommandPalette}>{name || 'Scholarly IDE'} — publications.md</div>
        </div>
      );
    }

    /* ─── Activity Bar ─── */
    function ActivityBar({ active, onSelect }) {
      const items = [
        { id: 'explorer', icon: <ExplorerIcon />, label: 'Explorer' },
        { id: 'search', icon: <SearchIcon />, label: 'Search' },
        { id: 'publications', icon: <PubsIcon />, label: 'Publications' },
        { id: 'terminal', icon: <TerminalIcon />, label: 'Terminal' },
      ];
      return (
        <div className="activitybar">
          {items.map(item => (
            <button
              key={item.id}
              className={`activity-icon ${active === item.id ? 'active' : ''}`}
              onClick={() => onSelect(item.id)}
              title={item.label}
            >
              {item.icon}
            </button>
          ))}
        </div>
      );
    }

    /* ─── Sidebar ─── */
    function SidebarComponent({ siteData, activePage }) {
      const [openSections, setOpenSections] = useState({ editors: true, project: true });
      const [openSubSections, setOpenSubSections] = useState({});

      const toggleSection = (key) => {
        setOpenSections(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const toggleSub = (key) => {
        setOpenSubSections(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const contact = siteData?.contact;

      return (
        <nav className="sidebar">
          <div className="sidebar-title">Explorer</div>
          <div className="sidebar-content">
            <div className="tree-section">
              <div className="tree-section-header" onClick={() => toggleSection('editors')}>
                <span className={`tree-chevron ${openSections.editors ? 'open' : ''}`}>{'\u25B8'}</span>
                Open Editors
              </div>
              <div className={`tree-section-body ${openSections.editors ? 'open' : ''}`}>
                <a href="publications.html" className={`tree-item ${activePage === 'publications' ? 'active' : ''}`}>
                  <span className="tree-item-icon file-md"><FileMdIcon /></span>
                  <span className="tree-item-label">publications.md</span>
                </a>
              </div>
            </div>

            <div className="tree-section">
              <div className="tree-section-header" onClick={() => toggleSection('project')}>
                <span className={`tree-chevron ${openSections.project ? 'open' : ''}`}>{'\u25B8'}</span>
                CBIRD-SITE
              </div>
              <div className={`tree-section-body ${openSections.project ? 'open' : ''}`}>
                <a href="index.html" className={`tree-item ${activePage === 'home' ? 'active' : ''}`}>
                  <span className="tree-item-icon file-md"><FileMdIcon /></span>
                  <span className="tree-item-label">home.md</span>
                </a>
                <a href="publications.html" className={`tree-item ${activePage === 'publications' ? 'active' : ''}`}>
                  <span className="tree-item-icon file-md"><FileMdIcon /></span>
                  <span className="tree-item-label">publications.md</span>
                </a>
                {siteData?.cv_link && (
                  <a href={siteData.cv_link} target="_blank" rel="noopener" className="tree-item">
                    <span className="tree-item-icon file-pdf"><FilePdfIcon /></span>
                    <span className="tree-item-label">cv.pdf</span>
                  </a>
                )}
                <div className="tree-item" onClick={() => toggleSub('contact')} style={{cursor:'pointer'}}>
                  <span className="tree-item-icon folder"><FolderIcon open={openSubSections.contact} /></span>
                  <span className="tree-item-label">contact/</span>
                </div>
                {openSubSections.contact && contact && (
                  <>
                    {contact.email && (
                      <a href={`mailto:${contact.email}`} className="tree-item tree-sub-item">
                        <span className="tree-item-icon file-mail"><MailIcon /></span>
                        <span className="tree-item-label">{contact.email}</span>
                      </a>
                    )}
                    {contact.links?.map((l, i) => (
                      <a key={i} href={l.url} target="_blank" rel="noopener" className="tree-item tree-sub-item">
                        <span className="tree-item-icon file-link"><LinkIcon /></span>
                        <span className="tree-item-label">{l.label}</span>
                      </a>
                    ))}
                  </>
                )}
                {siteData?.research_areas?.length > 0 && (
                  <>
                    <div className="tree-item" onClick={() => toggleSub('research')} style={{cursor:'pointer'}}>
                      <span className="tree-item-icon folder"><FolderIcon open={openSubSections.research} /></span>
                      <span className="tree-item-label">research_areas/</span>
                    </div>
                    {openSubSections.research && siteData.research_areas.map((area, i) => (
                      <div key={i} className="tree-item tree-sub-item" style={{cursor:'default'}}>
                        <span className="tree-item-icon file-chart"><ChartIcon /></span>
                        <span className="tree-item-label">{area.title}</span>
                      </div>
                    ))}
                  </>
                )}
              </div>
            </div>
          </div>
        </nav>
      );
    }

    /* ─── Peek Definition Widget ─── */
    function PeekWidget({ paper, onClose, onChat }) {
      const tags = parseTags(paper.tags);
      const tldr = parseTldr(paper);
      const slug = slugify(paper.title || 'untitled') + '.md';
      const peekRef = useRef(null);
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        // Trigger open animation on next frame
        requestAnimationFrame(() => setVisible(true));
      }, []);

      useEffect(() => {
        if (peekRef.current) {
          peekRef.current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }, [visible]);

      const handleClose = useCallback(() => {
        setVisible(false);
        setTimeout(() => onClose(), 150);
      }, [onClose]);

      useEffect(() => {
        const handler = (e) => {
          if (e.key === 'Escape') {
            e.preventDefault();
            e.stopPropagation();
            handleClose();
          }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, [handleClose]);

      // Parse extracted_paper_info for extra metadata
      let paperInfo = {};
      if (paper.extracted_paper_info) {
        try {
          paperInfo = typeof paper.extracted_paper_info === 'string'
            ? JSON.parse(paper.extracted_paper_info)
            : paper.extracted_paper_info;
        } catch {}
      }

      return (
        <div className={`peek-widget ${visible ? 'peek-open' : ''}`} ref={peekRef}>
          <div className="peek-header">
            <div className="peek-header-left">
              <span className="peek-header-icon"><FileMdIcon /></span>
              <span className="peek-header-filename">{slug}</span>
            </div>
            <button className="peek-header-close" onClick={handleClose} title="Close (Escape)">
              <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12">
                <path d="M8 8.71l3.65 3.64a.5.5 0 00.7-.7L8.71 8l3.64-3.65a.5.5 0 00-.7-.7L8 7.29 4.35 3.65a.5.5 0 00-.7.7L7.29 8l-3.64 3.65a.5.5 0 00.7.7L8 8.71z"/>
              </svg>
            </button>
          </div>
          <div className="peek-content">
            <div className="peek-actions">
              {paper.mapped_pdf && (
                <a className="pub-action-btn" href={paper.mapped_pdf} target="_blank" rel="noopener">
                  <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12"><path d="M13.71 4.29l-3-3A1 1 0 0010 1H4a1 1 0 00-1 1v12a1 1 0 001 1h8a1 1 0 001-1V5a1 1 0 00-.29-.71zM12 14H4V2h5v3a1 1 0 001 1h3v8z"/></svg>
                  PDF
                </a>
              )}
              {paper.doi && (
                <a className="pub-action-btn" href={`https://doi.org/${paper.doi}`} target="_blank" rel="noopener">
                  DOI
                </a>
              )}
              {paper.url && (
                <a className="pub-action-btn" href={paper.url} target="_blank" rel="noopener">
                  Link
                </a>
              )}
              <button className="pub-action-btn chat-btn" onClick={(e) => { e.stopPropagation(); onChat(paper); }}>
                <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12"><path d="M14 1H2a1 1 0 00-1 1v9a1 1 0 001 1h3l3 3 3-3h3a1 1 0 001-1V2a1 1 0 00-1-1zm0 10h-3.6L8 13.4 5.6 11H2V2h12v9z"/></svg>
                Chat with Paper
              </button>
            </div>

            {tldr && (
              <div className="peek-tldr">
                <div className="peek-comment">// tl;dr</div>
                <div className="peek-tldr-text">{tldr}</div>
              </div>
            )}

            <div className="peek-metadata">
              {paper.authors && (
                <div className="peek-meta-row">
                  <span className="peek-meta-key">authors:</span>
                  <span className="peek-meta-val-string">{paper.authors}</span>
                </div>
              )}
              {(paper.venue || paper.journal) && (
                <div className="peek-meta-row">
                  <span className="peek-meta-key">venue:</span>
                  <span className="peek-meta-val-string">{paper.venue || paper.journal}</span>
                </div>
              )}
              {paper.year && (
                <div className="peek-meta-row">
                  <span className="peek-meta-key">year:</span>
                  <span className="peek-meta-val-number">{paper.year}</span>
                </div>
              )}
              {paper.type && (
                <div className="peek-meta-row">
                  <span className="peek-meta-key">type:</span>
                  <span className="peek-meta-val-tag">{paper.type}</span>
                </div>
              )}
              {paper.doi && (
                <div className="peek-meta-row">
                  <span className="peek-meta-key">doi:</span>
                  <a className="peek-meta-val-link" href={`https://doi.org/${paper.doi}`} target="_blank" rel="noopener">{paper.doi}</a>
                </div>
              )}
            </div>

            {tags.length > 0 && (
              <div className="peek-tags">
                {tags.map((t, i) => (
                  <span className="pub-tag" key={i}>{t}</span>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ─── Publication Row ─── */
    function PubRow({ paper, lineNum, isExpanded, onToggle, onChat, isHovered, onHover }) {
      const tags = parseTags(paper.tags);
      const rowRef = useRef(null);

      const handleKeyDown = (e) => {
        if (e.key === 'F12' || e.key === 'Enter') {
          e.preventDefault();
          onToggle();
        }
      };

      return (
        <div
          className={`pub-row ${isHovered ? 'line-active' : ''}`}
          ref={rowRef}
          data-paper-id={paper.id}
          onMouseEnter={() => onHover(lineNum)}
          tabIndex={0}
          onKeyDown={handleKeyDown}
        >
          <div className="pub-row-main" onClick={onToggle}>
            <span className="pub-ln">{lineNum}</span>
            <span className="pub-year">{paper.year || '\u2014'}</span>
            <div className="pub-title-col">
              <div className="pub-title">{paper.title}</div>
              <div className="pub-authors">{paper.authors || ''}</div>
            </div>
            <span className="pub-venue">{paper.venue || paper.journal || ''}</span>
            <div className="pub-tags">
              {tags.slice(0, 3).map((t, i) => (
                <span className="pub-tag" key={i}>{t}</span>
              ))}
            </div>
          </div>
          {isExpanded && (
            <PeekWidget
              paper={paper}
              onClose={onToggle}
              onChat={onChat}
            />
          )}
        </div>
      );
    }

    /* ─── Status Bar ─── */
    function StatusBar({ paperCount, filteredCount, activeLine, terminalOpen, onToggleTerminal }) {
      return (
        <div className="statusbar">
          <div className="statusbar-left">
            <span className="statusbar-item">main</span>
            <span className="statusbar-item">0 errors 0 warnings</span>
          </div>
          <div className="statusbar-right">
            <span className="statusbar-item">Ln {activeLine || 1}, Col 1</span>
            <span className="statusbar-item">UTF-8</span>
            <span className="statusbar-item">Markdown</span>
            <span className="statusbar-item">{filteredCount}/{paperCount} pubs</span>
            <span className="statusbar-item clickable" onClick={onToggleTerminal} title="Toggle Terminal (Ctrl+`)">{terminalOpen ? 'Terminal: On' : 'Terminal: Off'}</span>
            <span className="statusbar-item">v2.0.0</span>
          </div>
        </div>
      );
    }

    /* ─── Main App ─── */
    function App() {
      const [siteData, setSiteData] = useState(null);
      const [allPapers, setAllPapers] = useState([]);
      const [search, setSearch] = useState('');
      const [activeTag, setActiveTag] = useState(null);
      const [expandedId, setExpandedId] = useState(null);
      const [chatPaper, setChatPaper] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeActivity, setActiveActivity] = useState('publications');
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [mobileSidebar, setMobileSidebar] = useState(false);
      const [commandPaletteOpen, setCommandPaletteOpen] = useState(false);
      const [terminalOpen, setTerminalOpen] = useState(false);
      const [hoveredLine, setHoveredLine] = useState(null);
      const editorContentRef = useRef(null);

      // Sync terminal height CSS variable with open/close state
      useEffect(() => {
        const shell = document.querySelector('.vscode-shell');
        if (shell) {
          shell.style.setProperty('--terminal-current-h', terminalOpen ? '250px' : '0px');
        }
      }, [terminalOpen]);

      useEffect(() => {
        Promise.all([
          fetch('/site_data.json').then(r => r.json()),
          fetch('/api/paper_data.json').then(r => r.json()),
        ]).then(([site, paperData]) => {
          setSiteData(site);
          const list = Object.entries(paperData.papers || {}).map(([id, p]) => ({ id, ...p }));
          list.sort((a, b) => (b.year || 0) - (a.year || 0));
          setAllPapers(list);
          setLoading(false);
        }).catch(() => setLoading(false));
      }, []);

      // Handle ?open=paperid from URL
      useEffect(() => {
        if (loading || allPapers.length === 0) return;
        const params = new URLSearchParams(window.location.search);
        const openId = params.get('open');
        if (openId) {
          setExpandedId(openId);
          // Scroll to paper after a short delay for rendering
          setTimeout(() => {
            const el = document.querySelector(`[data-paper-id="${openId}"]`);
            if (el) {
              el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }, 300);
        }
      }, [loading, allPapers]);

      // Keyboard shortcuts
      useEffect(() => {
        const handler = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
            e.preventDefault();
            setCommandPaletteOpen(prev => !prev);
          }
          if ((e.ctrlKey || e.metaKey) && e.key === '`') {
            e.preventDefault();
            setTerminalOpen(prev => !prev);
          }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, []);

      // Handle selecting paper from command palette
      const handleSelectPaperFromPalette = useCallback((paperId) => {
        setExpandedId(paperId);
        setTimeout(() => {
          const el = document.querySelector(`[data-paper-id="${paperId}"]`);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 100);
      }, []);

      const virtualFS = useMemo(() => buildVirtualFS(siteData, allPapers, handleSelectPaperFromPalette), [siteData, allPapers, handleSelectPaperFromPalette]);

      const handleActivitySelect = (id) => {
        if (id === 'terminal') {
          setTerminalOpen(prev => !prev);
          return;
        }
        if (id === 'explorer' || id === 'search') {
          if (id === activeActivity) {
            setSidebarOpen(!sidebarOpen);
          } else {
            setActiveActivity(id);
            setSidebarOpen(true);
          }
          return;
        }
        if (id === activeActivity) {
          setSidebarOpen(!sidebarOpen);
        } else {
          setActiveActivity(id);
          setSidebarOpen(true);
        }
      };

      const handleChatWithPaper = useCallback((paper) => {
        setChatPaper(paper);
        setTerminalOpen(true);
      }, []);

      // Expose global for peek widget "Chat with Paper" button
      useEffect(() => {
        window.__terminalSetChatPaper = (paper) => {
          setChatPaper(paper);
          setTerminalOpen(true);
        };
        return () => { delete window.__terminalSetChatPaper; };
      }, []);

      /* Collect all unique tags */
      const allTags = useMemo(() => {
        const tagSet = new Set();
        allPapers.forEach(p => parseTags(p.tags).forEach(t => tagSet.add(t)));
        return [...tagSet].sort();
      }, [allPapers]);

      /* Filter papers */
      const filtered = useMemo(() => {
        let list = allPapers;
        if (activeTag) {
          list = list.filter(p => parseTags(p.tags).includes(activeTag));
        }
        if (search.trim()) {
          const q = search.toLowerCase();
          list = list.filter(p =>
            (p.title || '').toLowerCase().includes(q) ||
            (p.authors || '').toLowerCase().includes(q) ||
            (p.venue || '').toLowerCase().includes(q) ||
            (p.journal || '').toLowerCase().includes(q) ||
            parseTags(p.tags).some(t => t.toLowerCase().includes(q))
          );
        }
        return list;
      }, [allPapers, search, activeTag]);

      const shellClasses = [
        'vscode-shell',
        !sidebarOpen ? 'sidebar-collapsed' : '',
        mobileSidebar ? 'mobile-sidebar-open' : '',
        terminalOpen ? 'terminal-open' : '',
      ].filter(Boolean).join(' ');

      return (
        <div className={shellClasses}>
          <button className="hamburger" onClick={() => setMobileSidebar(!mobileSidebar)}>{'\u2630'}</button>
          {mobileSidebar && <div className="mobile-overlay open" onClick={() => setMobileSidebar(false)}></div>}

          <TitleBar name={siteData?.name} onCommandPalette={() => setCommandPaletteOpen(true)} />
          <ActivityBar active={activeActivity} onSelect={handleActivitySelect} />
          <SidebarComponent siteData={siteData} activePage="publications" />

          <div className="editor-area">
            {/* Tab Bar */}
            <div className="tabbar">
              <a href="index.html" className="tab">
                <span className="tab-icon"><TabFileIcon color="#3794ff" /></span>
                home.md
                <span className="tab-close">{'\u00D7'}</span>
              </a>
              <a href="publications.html" className="tab active">
                <span className="tab-icon"><TabFileIcon color="#3794ff" /></span>
                publications.md
                <span className="tab-close">{'\u00D7'}</span>
              </a>
            </div>

            {/* Breadcrumb */}
            <div className="breadcrumb">
              <a href="#">cbird-site</a>
              <span className="breadcrumb-sep">{'\u203A'}</span>
              <span>publications.md</span>
            </div>

            {/* Editor content */}
            <div className="editor-content" ref={editorContentRef}>
              <div className="editor-body" style={{ flex: 1 }}>
                {loading ? (
                  <div className="loading">Loading publications...</div>
                ) : (
                  <>
                    {/* Search Bar */}
                    <div className="search-bar-container">
                      <div className="search-bar">
                        <span className="search-icon-prefix"><SearchIconSmall /></span>
                        <input
                          type="text"
                          placeholder="Search titles, authors, venues, tags..."
                          value={search}
                          onChange={e => setSearch(e.target.value)}
                        />
                        <span className="result-count">{filtered.length}/{allPapers.length}</span>
                      </div>
                    </div>

                    {/* Tag Filters */}
                    {allTags.length > 0 && (
                      <div className="tag-filters">
                        <button
                          className={`tag-btn ${!activeTag ? 'active' : ''}`}
                          onClick={() => setActiveTag(null)}
                        >
                          all
                        </button>
                        {allTags.map(t => (
                          <button
                            key={t}
                            className={`tag-btn ${activeTag === t ? 'active' : ''}`}
                            onClick={() => setActiveTag(activeTag === t ? null : t)}
                          >
                            {t}
                          </button>
                        ))}
                      </div>
                    )}

                    {/* Table Header */}
                    <div className="pub-list-header">
                      <span className="col-ln">#</span>
                      <span className="col-year">Year</span>
                      <span className="col-title">Title / Authors</span>
                      <span className="col-venue">Venue</span>
                      <span className="col-tags">Tags</span>
                    </div>

                    {/* Publication Rows */}
                    {filtered.map((p, idx) => (
                      <PubRow
                        key={p.id}
                        paper={p}
                        lineNum={idx + 1}
                        isExpanded={expandedId === p.id}
                        onToggle={() => setExpandedId(expandedId === p.id ? null : p.id)}
                        onChat={handleChatWithPaper}
                        isHovered={hoveredLine === idx + 1}
                        onHover={setHoveredLine}
                      />
                    ))}

                    {filtered.length === 0 && (
                      <div className="loading" style={{textAlign:'center', padding: '24px 0'}}>
                        No results matching "{search}"{activeTag ? ` in tag [${activeTag}]` : ''}
                      </div>
                    )}

                    <footer className="page-footer">
                      {allPapers.length} publications indexed
                    </footer>
                  </>
                )}
              </div>
            </div>
          </div>

          {/* Terminal Panel */}
          {terminalOpen && (
            <TerminalPanel
              papers={allPapers}
              chatPaper={chatPaper}
              setChatPaper={setChatPaper}
              onClose={() => setTerminalOpen(false)}
            />
          )}

          <StatusBar
            paperCount={allPapers.length}
            filteredCount={filtered.length}
            activeLine={hoveredLine || 1}
            terminalOpen={terminalOpen}
            onToggleTerminal={() => setTerminalOpen(prev => !prev)}
          />

          {commandPaletteOpen && (
            <CommandPalette files={virtualFS} onClose={() => setCommandPaletteOpen(false)} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
